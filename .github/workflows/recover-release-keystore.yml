name: Recover Release Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    name: Create Encrypted Keystore Recovery
    runs-on: ubuntu-latest

    steps:
      - name: Validate secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RECOVERY_PASSWORD: ${{ secrets.KEY_RECOVERY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$RECOVERY_PASSWORD"

      - name: Build encrypted recovery bundle
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RECOVERY_PASSWORD: ${{ secrets.KEY_RECOVERY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          mkdir -p recovery

          printf '%s' "$KEYSTORE_B64" | base64 --decode \
            > recovery/upload-keystore.jks

          cat > recovery/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF

          tar -C recovery -czf recovery.tar.gz \
            upload-keystore.jks key.properties

          openssl enc \
            -aes-256-cbc \
            -pbkdf2 \
            -iter 200000 \
            -salt \
            -in recovery.tar.gz \
            -out release-keystore-recovery.enc \
            -pass env:RECOVERY_PASSWORD

          rm -rf recovery recovery.tar.gz

          test -s release-keystore-recovery.enc

      - name: Upload encrypted recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-recovery
          path: release-keystore-recovery.enc
          retention-days: 1
